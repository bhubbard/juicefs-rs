[package]
name = "juicefs-fuse"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"
description = "Pure-Rust FUSE protocol adapter for JuiceFS VFS"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"

[dependencies]
juicefs-core = { path = "../juicefs-core" }
juicefs-meta = { path = "../juicefs-meta" }
juicefs-vfs = { path = "../juicefs-vfs" }
libc = "0.2"
parking_lot = "0.12"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
